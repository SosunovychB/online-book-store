version: "3.8"

services:
  mysqldb:
    platform: linux/x86_64
    image: mysql:8.0.33
    restart: unless-stopped
    env_file: ./.env
    environment:
      - MYSQL_USER=$MYSQL_USER
      - MYSQL_PASSWORD=$MYSQL_PASSWORD
      - MYSQL_DATABASE=$MYSQL_DATABASE
    ports:
      - $MYSQL_LOCAL_PORT:$MYSQL_DOCKER_PORT
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 30s
      timeout: 30s
      retries: 3

  mongodb:
    image: mongo
    restart: unless-stopped
    container_name: mongodb
    ports:
      - $MONGO_LOCAL_PORT:$MONGO_DOCKER_PORT
    environment:
      - MONGO_INITDB_ROOT_USERNAME=$MONGO_ROOT_USER
      - MONGO_INITDB_ROOT_PASSWORD=$MONGO_ROOT_PASSWORD
      - MONGO_INITDB_DATABASE=$MONGO_DATABASE
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 })' | mongosh --quiet"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    depends_on:
      mysqldb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: on-failure
    image: online-book-store:1.0.1
    build: .
    env_file: ./.env
    ports:
      - $SPRING_LOCAL_PORT:$SPRING_DOCKER_PORT
      - 127.0.0.1:$DEBUG_PORT:$DEBUG_PORT
    environment:
      SPRING_APPLICATION_JSON: >
        {
          "spring.datasource.url": "jdbc:mysql://mysqldb:$MYSQL_DOCKER_PORT/$MYSQL_DATABASE",
          "spring.datasource.username": "$MYSQL_USER",
          "spring.datasource.password": "$MYSQL_PASSWORD",
          "spring.data.mongodb.uri": "mongodb://$MONGO_ROOT_USER:$MONGO_ROOT_PASSWORD@mongodb:$MONGO_DOCKER_PORT/admin",
          "jwt.expiration": "$JWT_EXPIRATION",
          "jwt.secret": "$JWT_SECRET"
        }
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"

volumes:
  mongo_data: